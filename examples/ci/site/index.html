<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sample signup form (Proxy QA Browser CI example)</title>
    <style>
      :root {
        color-scheme: dark;
        --background: hsl(0 0% 3.9%);
        --card: hsl(0 0% 6%);
        --border: hsl(0 0% 14%);
        --foreground: hsl(0 0% 98%);
        --muted-foreground: hsl(0 0% 64%);
        --primary: hsl(221 83% 53%);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px 16px;
        background: var(--background);
        color: var(--foreground);
        font: 14px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
      }
      h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
      p { margin: 0 0 24px; color: var(--muted-foreground); }
      form { display: grid; gap: 16px; }
      .field { display: grid; gap: 6px; }
      label { font-weight: 500; }
      input[type='text'], input[type='email'], select {
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--background);
        color: var(--foreground);
        font: inherit;
      }
      .check { display: flex; align-items: center; gap: 8px; min-height: 44px; }
      button {
        min-height: 44px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      :is(input, select, button):focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      #result { min-height: 24px; margin: 16px 0 0; color: var(--foreground); }
    </style>
  </head>
  <body>
    <main>
      <h1>Create test account</h1>
      <p>Static sample page for the headless CI runner. Nothing is sent anywhere.</p>
      <form id="signup" data-testid="signup-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="plan">Plan</label>
          <select id="plan" name="plan">
            <option value="free">Free</option>
            <option value="team">Team</option>
          </select>
        </div>
        <div class="check">
          <input id="consent" name="consent" type="checkbox" required />
          <label for="consent">I agree to the test terms</label>
        </div>
        <button type="submit">Create account</button>
      </form>
      <p id="result" role="status" aria-live="polite"></p>
    </main>
    <script>
      document.getElementById('signup').addEventListener('submit', (event) => {
        event.preventDefault()
        const form = event.currentTarget
        const result = document.getElementById('result')
        if (!form.checkValidity()) {
          result.textContent = 'Please complete every field.'
          return
        }
        const name = form.elements.name.value.trim()
        const plan = form.elements.plan.value
        result.textContent = `Thanks, ${name}. Your ${plan} account is ready.`
        history.replaceState(null, '', '#submitted')
      })
    </script>
  </body>
</html>
