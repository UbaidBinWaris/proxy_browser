<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Small-size variant of icon.svg for 16, 24 and 32 px (used by scripts/make-icons.mjs):
    same tile and colours, larger globe with heavier strokes and a bigger, simpler badge so the
    mark stays legible on a 16 px taskbar / title bar.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <mask id="badge-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="380" cy="380" r="128" fill="#000"/>
    </mask>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#tile)"/>

  <g mask="url(#badge-cut)" fill="none" stroke="#FFFFFF" stroke-width="48">
    <circle cx="226" cy="226" r="166"/>
    <ellipse cx="226" cy="226" rx="66" ry="166"/>
    <line x1="60" y1="226" x2="392" y2="226"/>
  </g>

  <circle cx="380" cy="380" r="104" fill="#22C55E"/>
  <path d="M334 382 L366 414 L428 350" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
