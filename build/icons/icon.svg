<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Proxy QA Browser app mark (source of truth for build/icons/* and src/renderer/src/assets/app-icon.png).
    Rasterized by scripts/make-icons.mjs; sizes up to 32 px use icon-small.svg (heavier strokes).
    Squircle tile (22% corner radius), navy to blue gradient, white globe (outline, two meridians,
    equator; strokes ~6% of the tile) and a green "QA verified" check badge in the lower right.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <mask id="badge-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="378" cy="378" r="108" fill="#000"/>
    </mask>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="106" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="106" fill="url(#glow)"/>
  <rect x="18" y="18" width="476" height="476" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>

  <g mask="url(#badge-cut)" fill="none" stroke="#FFFFFF" stroke-width="30">
    <circle cx="236" cy="236" r="146"/>
    <ellipse cx="236" cy="236" rx="62" ry="146"/>
    <line x1="90" y1="236" x2="382" y2="236"/>
  </g>

  <circle cx="378" cy="378" r="86" fill="#22C55E"/>
  <path d="M338 380 L366 408 L420 352" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
