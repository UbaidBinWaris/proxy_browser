name: Feature request
description: Propose a QA capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the project scope in CONTRIBUTING.md first. Requests to evade bot detection,
        CAPTCHA or fraud controls are out of scope and will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What QA task is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
