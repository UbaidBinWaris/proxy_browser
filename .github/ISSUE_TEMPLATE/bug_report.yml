name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste proxy usernames, passwords, cookies or personal data. Use placeholders.
        Security issues go through SECURITY.md, not here.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About.
      placeholder: 1.3.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows (portable EXE)
        - Linux (AppImage)
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Launch / sessions
        - Proxy, targeting or location verification
        - Browser detection or installs
        - Devices
        - QA automation (scenarios, matrix, schedules)
        - CI command-line runner
        - Credential vault / settings
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Launch
        2. Pick Chromium, Pixel 9, Residential, New Jersey
        3. Click Launch
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error code and redacted log lines
      description: Settings → Advanced → Logs. The app redacts registered secrets; review before pasting.
      render: text
