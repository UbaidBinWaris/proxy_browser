name: Linux verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
        env:
          QA_REQUIRE_BROWSER_TESTS: '1'
      - run: npm run build
      - run: xvfb-run -a node scripts/desktop-smoke.mjs
      - run: xvfb-run -a node scripts/first-run-smoke.mjs
      - run: xvfb-run -a node scripts/launcher-ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke
          path: smoke-output/
