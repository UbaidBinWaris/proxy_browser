name: Linux verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix app/webapp
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
        env:
          QA_REQUIRE_BROWSER_TESTS: '1'
      - run: npm run build
      - run: xvfb-run -a node scripts/desktop-smoke.mjs
      - run: xvfb-run -a node scripts/first-run-smoke.mjs
      - run: xvfb-run -a node scripts/launcher-ui-smoke.mjs
      - run: xvfb-run -a node scripts/app-updates-ui-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-smoke
          path: smoke-output/
          retention-days: 1
