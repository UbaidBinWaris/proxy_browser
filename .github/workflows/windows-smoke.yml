# Builds the Windows portable EXE natively on Windows and runs an end-to-end
# smoke test of the packaged app (scripts/windows-smoke.cjs). No secrets are
# needed: the smoke test launches browsers with a direct connection.
name: Windows build + smoke test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm ci --prefix app/webapp

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Windows)
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build portable EXE
        run: npm run build:windows

      - name: Verify runtime archive copying in Electron
        run: node scripts/runtime-copy-smoke.mjs

      - name: Smoke test the packaged app
        run: node scripts/windows-smoke.cjs

      - name: Upload EXE and smoke results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-and-smoke
          path: |
            smoke-output/
          retention-days: 1
          if-no-files-found: warn
