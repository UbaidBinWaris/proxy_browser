# Builds the Windows portable EXE natively on Windows and runs an end-to-end
# smoke test of the packaged app (scripts/windows-smoke.cjs). No secrets are
# needed: the smoke test launches browsers with a direct connection.
name: Windows build + smoke test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Windows)
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build portable EXE
        run: npm run build:windows

      - name: Smoke test the packaged app
        run: node scripts/windows-smoke.cjs

      - name: Upload EXE and smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-and-smoke
          path: |
            release/*.exe
            smoke-output/
          if-no-files-found: warn
