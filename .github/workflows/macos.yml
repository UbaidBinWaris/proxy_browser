# Builds unsigned macOS apps natively and smoke-tests the packaged app (scripts/macos-smoke.mjs).
# No Apple account or secrets are used: the build is ad-hoc signed (scripts/mac-signing.mjs).
# This workflow verifies only; macOS is not published by deploy.yml yet — see
# docs/DISTRIBUTION.md → macOS → "Publishing macOS releases" for the steps once signing exists.
name: macOS build + smoke test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
jobs:
  macos:
    # macos-latest is Apple silicon: the arm64 app is launched, the x64 app is packaged and inspected.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install website dependencies
        run: npm ci --prefix app/webapp

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (macOS)
        run: npm test

      - name: Website tests
        run: npm test --prefix app/webapp

      - name: Build the renderer and main process
        run: npm run build

      - name: Package unsigned arm64 app (DMG + ZIP)
        run: npx electron-builder --mac dmg zip --arm64 --config electron-builder.config.mjs

      - name: Package unsigned x64 app (ZIP)
        run: npx electron-builder --mac zip --x64 --config electron-builder.config.mjs

      - name: Inspect the packaged apps
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          ls -la release
          for file in "Proxy-QA-Browser-${version}-macOS-arm64.dmg" "Proxy-QA-Browser-${version}-macOS-arm64.zip" "Proxy-QA-Browser-${version}-macOS-x64.zip"; do
            test -s "release/$file" || { echo "missing release/$file"; exit 1; }
          done
          lipo -archs release/mac-arm64/Proxy-QA-Browser.app/Contents/MacOS/Proxy-QA-Browser | grep -qx arm64
          lipo -archs release/mac/Proxy-QA-Browser.app/Contents/MacOS/Proxy-QA-Browser | grep -qx x86_64
          codesign --verify --deep --strict release/mac/Proxy-QA-Browser.app
          hdiutil imageinfo "release/Proxy-QA-Browser-${version}-macOS-arm64.dmg" > /dev/null

      - name: Smoke test the packaged arm64 app
        run: node scripts/macos-smoke.mjs

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-smoke
          path: smoke-output/
          retention-days: 1
          if-no-files-found: warn
