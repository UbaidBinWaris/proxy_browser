name: Build and deploy browser releases
# Release by pushing a version tag: `npm run release:version -- minor`, commit, then
# `git tag v1.5.0 && git push origin v1.5.0`. Pushes to main only run the verification workflows.
# A manual run (workflow_dispatch) publishes package version + run number, as before.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proxy-browser-production
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify the signing secret against desktop and website public keys
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: node scripts/verify-release-key.mjs
      - name: Verify deployment SSH authentication and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          bash deploy/configure-ci-ssh.sh
          ssh proxy-browser-production 'test -d /var/lib/proxy-browser/staging && test -w /var/lib/proxy-browser/staging && echo "Deployment SSH authentication and host-key verification passed"' \
            || { echo '::error title=Deployment SSH::Could not sign in to the production server or its staging folder is missing or not writable. Check DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS (must match DEPLOY_HOST and DEPLOY_PORT), DEPLOY_HOST, DEPLOY_USER and DEPLOY_PORT.'; exit 1; }
      - name: Clear ephemeral SSH key
        if: always()
        run: rm -f ~/.ssh/proxy-browser-deploy
  windows:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: version
        run: node scripts/ci-release-version.mjs
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - name: Build the Windows EXE (Azure Trusted Signing when its secrets are configured)
        shell: bash
        env:
          PROXY_QA_AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          PROXY_QA_AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          PROXY_QA_AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          PROXY_QA_AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -n "$PROXY_QA_AZURE_SIGN_ENDPOINT" ]; then export PROXY_QA_SIGNED_RELEASE=1; echo "Signing with Azure Trusted Signing"; else echo "No signing secrets configured: building an unsigned EXE"; fi
          npm run build:windows
      - run: node scripts/windows-smoke.cjs
      - id: asset
        run: node scripts/release-asset.mjs win32
      # Name, size and SHA-256 for the publish job. An artifact, not a job output: GitHub drops outputs that contain
      # any secret's value.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata-win32
          path: release/metadata/win32-x64.json
          if-no-files-found: error
          retention-days: 1
      - name: Transfer EXE directly over SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_FILE: ${{ steps.asset.outputs.fileName }}
        run: |
          bash deploy/configure-ci-ssh.sh
          ssh proxy-browser-production "mkdir -p /var/lib/proxy-browser/staging/'$RELEASE_VERSION'"
          scp "release/$RELEASE_FILE" "proxy-browser-production:/var/lib/proxy-browser/staging/$RELEASE_VERSION/$RELEASE_FILE"
      - if: always()
        shell: bash
        run: rm -f ~/.ssh/proxy-browser-deploy
  update-smoke:
    # A real update on Windows: an old packaged build verifies a signed update, restarts, and the new
    # build finishes it (computer copy, shortcuts). Throwaway key and versions; nothing is published.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - run: npm run build
      - run: node scripts/update-smoke.mjs
  macos:
    # Unsigned macOS builds: ad-hoc signed and not notarized (no Apple Developer account yet). Users open
    # them once via System Settings → Privacy & Security → Open Anyway, as the download card explains.
    # Once Apple credentials exist, add CSC_LINK/CSC_KEY_PASSWORD and APPLE_API_* here (scripts/mac-signing.mjs).
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: version
        run: node scripts/ci-release-version.mjs
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package unsigned DMGs (Apple silicon and Intel)
        run: |
          npx electron-builder --mac dmg --arm64 --config electron-builder.config.mjs
          npx electron-builder --mac dmg --x64 --config electron-builder.config.mjs
      - name: Smoke test the packaged Apple silicon app
        run: node scripts/macos-smoke.mjs
      - id: arm64
        run: node scripts/release-asset.mjs darwin arm64 dmg
      - id: x64
        run: node scripts/release-asset.mjs darwin x64 dmg
      # Name, size and SHA-256 for the publish job. An artifact, not a job output: GitHub drops outputs that contain
      # any secret's value.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata-darwin
          path: release/metadata/darwin-*.json
          if-no-files-found: error
          retention-days: 1
      - name: Transfer DMGs directly over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ARM64_FILE: ${{ steps.arm64.outputs.fileName }}
          X64_FILE: ${{ steps.x64.outputs.fileName }}
        run: |
          bash deploy/configure-ci-ssh.sh
          ssh proxy-browser-production "mkdir -p /var/lib/proxy-browser/staging/'$RELEASE_VERSION'"
          # scp, as in the Windows job: macOS runners ship Apple's openrsync, not GNU rsync.
          scp "release/$ARM64_FILE" "release/$X64_FILE" "proxy-browser-production:/var/lib/proxy-browser/staging/$RELEASE_VERSION/"
      - if: always()
        run: rm -f ~/.ssh/proxy-browser-deploy
  linux:
    needs: preflight
    # Pinned, not ubuntu-latest (Ubuntu 26 from 2026-10-19): the AppImage bundles libraries from this image.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: version
        run: node scripts/ci-release-version.mjs
      - run: npm ci
      - run: npm ci --prefix app/webapp
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
        env:
          QA_REQUIRE_BROWSER_TESTS: '1'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            build/browsers/linux
            build/webkit-libs/linux
            ~/.cache/electron
            ~/.cache/electron-builder
          # Exact key only: a partial restore could add old browser revisions to the AppImage.
          key: linux-bundle-${{ hashFiles('package-lock.json', 'scripts/bundle-browsers.mjs') }}
      - run: npm run build:linux
      # Headless QA runs must work with the browsers the AppImage ships (no Chromium headless shell).
      - run: node scripts/bundled-qa-smoke.mjs build/browsers/linux
      - run: xvfb-run -a node scripts/runtime-copy-smoke.mjs
      - run: xvfb-run -a node scripts/computer-setup-smoke.mjs
        env:
          # Hosted runners may lack FUSE; exercise the real AppImage via extraction.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          DEBUG: pw:browser
      - id: asset
        run: node scripts/release-asset.mjs linux
      # Name, size and SHA-256 for the publish job. An artifact, not a job output: GitHub drops outputs that contain
      # any secret's value.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata-linux
          path: release/metadata/linux-x64.json
          if-no-files-found: error
          retention-days: 1
      - name: Transfer AppImage directly over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_FILE: ${{ steps.asset.outputs.fileName }}
        run: |
          bash deploy/configure-ci-ssh.sh
          ssh proxy-browser-production "mkdir -p /var/lib/proxy-browser/staging/'$RELEASE_VERSION'"
          rsync -av --partial "release/$RELEASE_FILE" "proxy-browser-production:/var/lib/proxy-browser/staging/$RELEASE_VERSION/"
      - if: always()
        run: rm -f ~/.ssh/proxy-browser-deploy
  website:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: scripts/sync-docs.mjs dates each docs page by its last commit for the sitemap.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/webapp/package-lock.json
      - run: npm ci --prefix app/webapp
      - run: npm audit --prefix app/webapp --omit=dev
      - run: node scripts/sync-brand.mjs
      # Strict: fails when a page in docs/site/manifest.json is missing or its title does not match.
      - run: node scripts/sync-docs.mjs
      - run: npm test --prefix app/webapp
      - run: npm run typecheck --prefix app/webapp
      - run: npm run build --prefix app/webapp
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: bash deploy/package-webapp.sh
      - name: Transfer website archive directly over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          bash deploy/configure-ci-ssh.sh
          remote="/var/tmp/proxy-browser-${COMMIT_SHA}-${RUN_ID}"
          ssh proxy-browser-production "mkdir -p '$remote'"
          rsync -av --partial .deploy/webapp.tar.gz deploy/install-webapp.sh deploy/publish-release.sh "proxy-browser-production:$remote/"
      - if: always()
        run: rm -f ~/.ssh/proxy-browser-deploy
  publish:
    needs: [windows, update-smoke, macos, linux, website]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: version
        run: node scripts/ci-release-version.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-metadata-*
          path: release/metadata
          merge-multiple: true
      - name: Sign trusted build-job metadata with the existing publisher key
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_PRIVATE_KEY"
          umask 077
          mkdir -p .release-keys
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > .release-keys/private-key.pem
          node scripts/sign-release-metadata.mjs release/metadata
          rm -f .release-keys/private-key.pem
      - name: Deploy website and atomically publish the verified binaries
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          bash deploy/configure-ci-ssh.sh
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          remote="/var/tmp/proxy-browser-${COMMIT_SHA}-${RUN_ID}"
          rsync -av release/Proxy-QA-Browser-Update.json release/update.json "proxy-browser-production:/var/lib/proxy-browser/staging/$RELEASE_VERSION/"
          ssh proxy-browser-production "bash '$remote/install-webapp.sh' '$remote/webapp.tar.gz' '$COMMIT_SHA' && bash '$remote/publish-release.sh' '$RELEASE_VERSION' && install -d -m 755 /opt/proxy-browser/deploy && install -m 755 '$remote/install-webapp.sh' '$remote/publish-release.sh' /opt/proxy-browser/deploy/ && rm -rf '$remote'"
          curl --fail --silent --show-error --max-time 30 https://proxybrowser.ubaidbinwaris.com/api/health
          curl --fail --silent --show-error --max-time 30 https://proxybrowser.ubaidbinwaris.com/api/updates/stable -o published-update.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {verify} from "node:crypto"; const envelope=JSON.parse(readFileSync("published-update.json")); if (!verify(null,Buffer.from(envelope.payload),readFileSync("resources/updates/public-key.pem"),Buffer.from(envelope.signature,"base64")) || JSON.parse(envelope.payload).version !== process.env.RELEASE_VERSION) process.exit(1)'
      - name: Clear ephemeral keys
        if: always()
        run: rm -f .release-keys/private-key.pem ~/.ssh/proxy-browser-deploy
  github-release:
    # After a tagged release is live, mirror it as a GitHub release (notes, download links, SHA-256) built from the
    # signed manifest the website now serves. No binaries are uploaded: downloads stay on the website.
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          curl --fail --silent --show-error --max-time 30 https://proxybrowser.ubaidbinwaris.com/api/updates/stable -o published-update.json
          node scripts/github-release-notes.mjs published-update.json "${TAG#v}" > github-release.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Proxy QA Browser $TAG" --notes-file github-release.md --latest
          else
            gh release create "$TAG" --verify-tag --title "Proxy QA Browser $TAG" --notes-file github-release.md --latest
          fi
