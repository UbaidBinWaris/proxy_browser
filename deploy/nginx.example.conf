# Add these limit_req_zone directives once in nginx's http {} context.
# limit_req_zone $binary_remote_addr zone=proxy_browser_admin:10m rate=10r/m;
# limit_req_zone $binary_remote_addr zone=proxy_browser_checks:10m rate=30r/m;
# Merge the locations below into your manually configured HTTPS server {}.
# server_name proxybrowser.ubaidbinwaris.com;
# ssl_certificate /your/certificate/fullchain.pem;
# ssl_certificate_key /your/certificate/privkey.pem;
# Redirect HTTP to HTTPS. Keep port 4500 closed to the Internet.

location /api/admin/ {
    limit_req zone=proxy_browser_admin burst=10 nodelay;
    client_max_body_size 2048m;
    client_body_timeout 1800s;
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_pass http://127.0.0.1:4500;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location /api/download/ {
    proxy_pass http://127.0.0.1:4500;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1800s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location /api/updates/ {
    limit_req zone=proxy_browser_checks burst=15 nodelay;
    proxy_pass http://127.0.0.1:4500;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location / {
    proxy_pass http://127.0.0.1:4500;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
